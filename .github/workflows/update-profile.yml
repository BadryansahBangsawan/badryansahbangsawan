name: Update Profile Stats

on:
  schedule:
    # Hourly so Streak / Longest track today's contributions.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update_profile.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests lxml python-dateutil

      - name: Update profile stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          USER_NAME: BadryansahBangsawan
          USER_TZ: Asia/Jakarta
          TZ: Asia/Jakarta
        run: |
          python update_profile.py



      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/dark_mode.svg assets/light_mode.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stats $(date +%F)"
            git push
          fi
